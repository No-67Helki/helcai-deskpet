<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; script-src 'self'; style-src 'unsafe-inline'">
  <title>赫尔财</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #pet-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #rename-input {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      padding: 5px 7px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #748f80;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #333;
      outline: none;
      z-index: 10;
    }
    #status-box {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 8px;
      border-radius: 10px;
      background: rgba(31, 36, 33, 0.92);
      color: white;
      font-size: 12px;
      line-height: 1.35;
      padding: 7px 9px;
      z-index: 20;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="pet-canvas"></canvas>
  <input id="rename-input" type="text" maxlength="32" placeholder="宠物名字" hidden>
  <div id="status-box" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
